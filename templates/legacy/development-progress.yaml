document_mode: full # simple或full
artifacts: [] # 每项kind/path/sha256；path相对output_dir，实际原字节SHA256，禁止..和链接
missing_artifacts: [] # full部分稿列尚缺technical_plan/implementation_plan；与已有稿互斥；完整稿为空
execution:
  status: running # running/needs_input/blocked；最终ready仍由result交接
  summary: null
  questions: []
  block_reason: null
previous_manifest_sha256: null # 首次null，后续为上一个完整清单原字节摘要
