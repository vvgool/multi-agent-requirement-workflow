# 仅供存量progress_path任务使用，新任务不创建；见workflow/legacy-plan-notifications.md
schema_version: 1
feature_id: null
requirements_revision: 1
run_id: null
role: development
framework: null # 与task一致；无锁历史任务保持原实际身份，不伪造包
kind: plan_ready # 完整首稿plan_ready，完整后续plan_updated；真实部分稿plan_partial，仅needs_input/blocked；不是最终result
