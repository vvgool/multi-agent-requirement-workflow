schema_version: 1
feature_id: null
requirements_revision: 1
layout_version: 2 # 与当前修订状态一致；旧任务缺字段视为1
run_id: null
role: null # development 或 testing
framework: null # 新锁定安装必填{name,version,protocol_version,sha256}；无锁历史任务保持缺失/null
framework_lock: null # {path,sha256}，引用需求内按原字节摘要保存的锁快照；旧run沿原路径
effective_config: null # {path,sha256}，引用需求内不可变有效配置快照；路径相对feature_dir
framework_root: null # 当前宿主动态解析
workspace_root: null
feature_dir: null
target_project: null
input_path: null
requirements_path: null
approval_digest: null
development_run_id: null # 测试必填；开发时为空
development_baseline: null # 测试必填：run_id 与 code_baseline；见 workflow/code-baseline.md
defect_report_path: null # 修复任务必填，首次开发可为空
required_files: [] # 额外必读资料，不重复专用字段；测试必含原开发result，复用时列原result及必要来源
output_dir: null # 当前run的outputs/，候选文稿与证据
result_path: null # 布局2必须填当前run/result.yaml；artifacts仍相对output_dir
write_scope:
  project_paths: [] # 明确允许的代码范围；使用既有项目缓存也须明确目录授权
  temporary_paths: [] # 按真实命令明确本轮字体/构建缓存/隔离现场位置；缺授权且必需时blocked，不退存outputs；见execution-contract“缓存与证据”
  modify_business_source: false # 开发获授权后才设 true；测试始终 false
completion_criteria: [] # 必填本轮目标及特有完成条件；阶段Skill通用门槛直接适用，不复制全文
