schema_version: 1
feature_id: null
requirements_revision: 1
run_id: null
role: product
status: null # ready、needs_input、blocked 或 stale_task（处置见 workflow/execution-contract.md）
summary: null # 当前目标/范围理解及本轮变化；推荐不等于用户确认
artifacts: [] # 每项为 kind 和 path，path 相对当前 run 的 outputs/；requirements 与 quality_check 可指向同一文稿
acceptance_ids: []
questions: [] # 每项必含 question/impact；新 needs_input 另含 id、dependencies、validity，含义见 workflow/handoff.md
# questions 条目：id 为当前修订内稳定标识；dependencies 为问题ID或已知前提/来源引用列表（独立题用[]）；
# validity 为适用条件及会导致本题/其他题失效的回答说明，独立题也说明边界；
# options、recommendation（推荐及依据）按需提供。旧格式仍有效，不回填历史；依据不足交产品重新分析。
assumptions: [] # 每项为 statement 和 confirmed
block_reason: null
