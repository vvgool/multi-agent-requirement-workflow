kind: null # 真实对象package / service / none；不因manual无需发布伪改none
status: unknown # succeeded / failed / partial / rolled_back / revoked / unknown / unpublished / not_required；实际状态独立于完成条件
occurred_at: null
target: null # 实际发布渠道；服务必须为当前请求的环境
identity: null # 版本、制品或部署身份
