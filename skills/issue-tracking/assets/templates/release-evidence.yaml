receipt: null # 可读取回执，不是只有tag/commit/build
receipt_readable: false # 协调实际读取并保留证据才true
published: false
public: false # package必须为true
draft: false
environment: null # service目标环境
runtime_verified: false # service实际部署/运行身份已核实
feature_id: null
baseline_id: null
delivery_id: null
code_baseline_digest: null
coverage: [] # 已发布的实际范围标识
